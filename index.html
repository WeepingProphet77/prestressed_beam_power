<!doctype html>
<!-- The default UI style is set here rather than by React so the token blocks
     apply on the very first paint, and so the app is still styled if the
     script fails to load. The inline script below upgrades it to the stored
     preference before paint, avoiding a flash of the wrong style. -->
<html lang="en" data-ui-style="star-trek-holo">
  <head>
    <script>
      (function () {
        /* Ids of the registered styles. Only a value in this list is applied:
           a stale preference for a style that has since been removed would
           otherwise set an attribute no stylesheet matches, and the app would
           paint entirely unstyled until React mounted and corrected it.
           Kept in sync with src/styles/registry.js by a test. */
        var KNOWN = ['star-trek-holo'];
        try {
          var stored = localStorage.getItem('ui-style');
          if (stored && KNOWN.indexOf(stored) !== -1) {
            document.documentElement.setAttribute('data-ui-style', stored);
          }
        } catch (e) {
          /* Storage unavailable — the default attribute already applies. */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#01080d" />
    <title>Prestressed Concrete Beam Calculator | ACI 318</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
